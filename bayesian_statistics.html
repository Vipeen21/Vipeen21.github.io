<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayesian Statistics using Python | Vipeen Kumar</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Typography plugin to format the rendered Markdown -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Marked.js for parsing Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for rendering LaTeX math equations -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { 
            background-color: #fac47e; 
            font-family: 'Inter', Arial, sans-serif; 
        }
        /* Calculate height to stay within screen, leaving room for the header */
        .scroll-area { height: calc(100vh - 70px); }
    </style>
</head>
<body class="m-0 p-0 overflow-hidden text-gray-800 flex flex-col h-screen">

    <!-- Fixed Header -->
    <header class="bg-[#333] text-white p-5 text-xl shadow-md h-[70px] box-border w-full z-50 flex justify-between items-center rounded-b-lg flex-shrink-0">
        <span class="font-bold">Bayesian Statistics using Python</span>
        <a href="index.html" class="text-sm bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded transition">Back to Home</a>
    </header>

    <!-- Main Layout (Sidebar + Content) -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <nav class="w-1/4 min-w-[250px] bg-[#fac47e] p-6 overflow-y-auto scroll-area border-r border-gray-700/20">
            <h2 class="text-xl font-bold mb-4 text-[#7B5E57]">Chapters</h2>
            <ul id="nav-links" class="space-y-2 font-semibold text-sm">
                <!-- Navigation links will be injected here by JavaScript -->
            </ul>
        </nav>

        <!-- Markdown Content Area -->
        <main class="w-3/4 p-10 overflow-y-auto scroll-area bg-white rounded-tl-xl shadow-inner">
            <!-- The 'prose' class automatically styles the raw HTML output to look like a professional article -->
            <article id="content" class="prose prose-lg max-w-none prose-h1:text-[#7B5E57] prose-a:text-blue-600">
                <h2 class="animate-pulse text-gray-500">Loading course content...</h2>
            </article>
        </main>
    </div>

    <script>
        // Setup Marked.js to interpret ```math code blocks as LaTeX equations
        marked.use({
            renderer: {
                code(token) {
                    // In recent marked.js versions, 'lang' holds the info string and 'text' holds the code
                    if (token.lang === 'math' || token.lang === 'latex') {
                        // Escape characters so the browser doesn't misinterpret math as HTML tags (like < or >)
                        const escapedMath = token.text
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;");
                        
                        // Wrap the raw code in standard MathJax display blocks \[ ... \] 
                        return '<div class="my-6 overflow-x-auto">\\[ ' + escapedMath + ' \\]</div>';
                    }
                    return false; // Use default marked.js behavior for other code blocks (like Python)
                }
            }
        });

        // Base URL for your raw GitHub files
        const repoBase = "https://raw.githubusercontent.com/Vipeen21/bayesian-statistics-python/main/";

        // Array mapping display titles to exact URL-encoded file names in your repository
        const chapters = [
            { title: "Introduction", file: "Introduction.md" },
            { title: "Table of Contents", file: "Contents.md" },
            { title: "Chapter 1: Bayes' Theorem & Foundations", file: "Chapter%201%3A%20Bayes%E2%80%99%20Theorem%20%26%20Probability%20Foundations.md" },
            { title: "Chapter 2: Frequentist vs. Bayesian", file: "Chapter%202%3A%20The%20Great%20Debate%3A%20Frequentist%20vs.%20Bayesian%20Statistics.md" },
            { title: "Chapter 3: Conjugate Priors", file: "Chapter%203%3A%20Conjugate%20Priors%20%26%20Posterior%20Distributions.md" },
            { title: "Chapter 4: Bayesian Estimators", file: "Chapter%204%3A%20Bayesian%20Estimators%20and%20Credible%20Intervals.md" },
            { title: "Chapter 5: Loss Functions", file: "Chapter%205%3A%20Loss%20Functions%20and%20Decision%20Theory.md" },
            { title: "Chapter 6: Hypothesis Testing", file: "Chapter%206%3A%20Bayesian%20Hypothesis%20Testing%20%26%20Model%20Comparison.md" },
            { title: "Chapter 7: MCMC – Part I", file: "Chapter%207%3A%20Markov%20Chain%20Monte%20Carlo%20(MCMC)%20%E2%80%93%20Part%20I.md" },
            { title: "Chapter 8: MCMC – Part II", file: "Chapter%208%3A%20MCMC%20%E2%80%93%20Part%20II%20(Advanced%20Topics).md" },
            { title: "Chapter 9: Variational Inference", file: "Chapter%209%3A%20Variational%20Inference.md" },
            { title: "Chapter 10: Linear & Logistic Regression", file: "Chapter%2010%3A%20Bayesian%20Linear%20and%20Logistic%20Regression.md" },
            { title: "Chapter 11: Hierarchical Models", file: "Chapter%2011%3A%20Hierarchical%20(Multilevel)%20Bayesian%20Models.md" },
            { title: "Chapter 12: Model Diagnostics", file: "Chapter%2012%3A%20Model%20Diagnostics%20and%20Posterior%20Predictive%20Checks.md" },
            { title: "Chapter 13: Bayesian Model Averaging", file: "Chapter%2013%3A%20Bayesian%20Model%20Averaging.md" },
            { title: "Chapter 14: Prior Elicitation", file: "Chapter%2014%3A%20Prior%20Elicitation%20and%20Sensitivity%20Analysis.md" },
            { title: "Chapter 15: Applications", file: "Chapter%2015%3A%20Applications%20%E2%80%93%20Econometrics%2C%20Finance%2C%20and%20Machine%20Learning.md" }
        ];

        const navLinks = document.getElementById('nav-links');
        const contentDiv = document.getElementById('content');

        // 1. Build the Sidebar Navigation
        chapters.forEach((chapter, index) => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = "#";
            a.className = "text-[#333] hover:text-[#7B5E57] hover:bg-white/50 block p-2 rounded transition duration-200";
            a.textContent = chapter.title;

            // When a chapter is clicked, fetch and render its content
            a.onclick = (e) => {
                e.preventDefault();
                
                // Visual highlight for the active link
                document.querySelectorAll('#nav-links a').forEach(link => link.classList.remove('bg-white', 'shadow-sm', 'text-[#7B5E57]'));
                a.classList.add('bg-white', 'shadow-sm', 'text-[#7B5E57]');

                loadMarkdown(repoBase + chapter.file);
            };
            li.appendChild(a);
            navLinks.appendChild(li);
        });

        // 2. Fetch and Render Markdown function
        async function loadMarkdown(url) {
            // Scroll to top of content area on new load
            contentDiv.parentElement.scrollTop = 0; 
            contentDiv.innerHTML = '<h2 class="animate-pulse text-gray-500 mt-10 text-center">Fetching chapter content...</h2>';
            
            try {
                // Fetch the raw markdown from GitHub
                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch markdown file from GitHub.");
                const markdown = await response.text();

                // Convert Markdown to HTML
                contentDiv.innerHTML = marked.parse(markdown);

                // Command MathJax to render the newly injected LaTeX equations safely
                const renderMath = () => {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        MathJax.typesetClear([contentDiv]);
                        MathJax.typesetPromise([contentDiv]).catch((err) => console.log('MathJax error: ', err));
                    } else {
                        // Retry after a short delay if MathJax hasn't fully initialized
                        setTimeout(renderMath, 200);
                    }
                };
                renderMath();

            } catch (error) {
                contentDiv.innerHTML = `<h2 class="text-red-600">Error loading content: ${error.message}</h2>`;
            }
        }

        // 3. Automatically load the first chapter on initialization
        if(chapters.length > 0) {
            navLinks.querySelector('a').click();
        }
    </script>
</body>
</html>
